<style>
:root{--bg:#101721;--deep:#070b12;--surface:#171f2c;--edge:#344255;--ink:#f0f4fa;--muted:#acbbce;--blue:#8ed5f3;--gold:#ffc779;--mint:#90e1bd;--red:#ff8a7a;--violet:#d5afff;--accent:#90e1bd;--heading:"Bahnschrift","Segoe UI",system-ui,sans-serif;font:clamp(16px,.55vw + 11.5px,19px)/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--deep);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow:hidden;-webkit-tap-highlight-color:transparent;background:radial-gradient(120% 80% at 50% 0%,#121c2b,#05080d)}
a{color:var(--blue)}a:hover{color:var(--ink)}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{height:100vh;height:100dvh;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:16px;padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));border-bottom:1px solid #1d2736;background:rgba(7,11,18,.9);min-width:0}
.logo{display:inline-flex;align-items:center;gap:9px;flex:none}
.logo .orb{position:relative;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8fff0,var(--mint) 45%,#2d6b55)}

.logo b{font:800 1.12rem/1 var(--heading);letter-spacing:.24em}

.mtitle{min-width:0;flex:1;display:grid}
.mtitle b{font:800 .72rem var(--heading);letter-spacing:.14em;color:var(--mint);text-transform:uppercase}
.mtitle span{font:700 .95rem/1.2 var(--heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{flex:none;display:grid;gap:5px;justify-items:end}
.prog span{font:700 .72rem ui-monospace,Consolas,monospace;color:var(--muted)}
.prog .segs{display:flex;gap:3px}.prog .segs i{width:12px;height:5px;border-radius:3px;background:#243042}.prog .segs i.done{background:var(--mint)}.prog .segs i.now{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.stage{flex:1;position:relative;min-height:0;overflow:hidden}
.screen{position:absolute;inset:0;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right)) 20px max(16px,env(safe-area-inset-left));overflow:auto;animation:scrIn .5s cubic-bezier(.2,.8,.2,1) both}

.card{width:min(760px,100%);background:linear-gradient(180deg,#1b2432,#141b26);border:1px solid var(--edge);border-radius:14px;padding:22px 24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 24px 50px -24px #000;display:grid;gap:14px}
.eyebrow{font:800 .7rem var(--heading);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h2{margin:0;font:800 clamp(1.3rem,3vw,1.9rem)/1.15 var(--heading);letter-spacing:-.01em;text-wrap:balance}
p{margin:0;text-wrap:pretty}
.muted{color:var(--muted)}
.btn{min-height:46px;padding:8px 18px;border-radius:9px;border:1px solid var(--edge);background:var(--bg);color:var(--ink);font:700 .95rem var(--heading);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 0 rgba(0,0,0,.5);transition:transform .08s,border-color .15s,background .15s}

.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent),#fff 18%),var(--accent));border-color:var(--accent);color:#0b111a}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.ava .visor::after{content:"";position:absolute;left:10%;top:8%;width:36%;height:22%;border-radius:50%;background:rgba(255,255,255,.32);transform:rotate(-14deg)}
.ava .visor i{display:block;width:2px;height:2px;border-radius:1px;background:var(--c);box-shadow:0 0 5px var(--c)}
.ava.talking .visor i{animation:wave .4s ease-in-out infinite alternate}
.ava.talking .visor i:nth-child(2){animation-delay:-.12s}.ava.talking .visor i:nth-child(3){animation-delay:-.3s}.ava.talking .visor i:nth-child(4){animation-delay:-.06s}.ava.talking .visor i:nth-child(5){animation-delay:-.22s}

.dlg .dtx{flex:1;min-width:0;display:grid;gap:4px}
.dlg .who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.dlg .nm{font:800 .98rem var(--heading);color:var(--c)}.dlg .rl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dlg .tx{min-height:2.9em;font-size:1.02rem;line-height:1.45}
.dlg .more{position:absolute;right:14px;bottom:8px;color:var(--c);font-size:.8rem;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.choice{flex:1 1 200px;max-width:280px;display:grid;gap:4px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--cc,var(--edge));background:linear-gradient(180deg,color-mix(in srgb,var(--cc,var(--edge)) 22%,#111823),#111823);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 0 rgba(0,0,0,.5);transition:transform .1s}
.choice:hover:not(:disabled){transform:translateY(-2px)}.choice:active:not(:disabled){transform:translateY(2px)}
.choice b{font:800 1rem var(--heading)}.choice span{font-size:.82rem;color:var(--muted)}.choice em{font:800 .9rem ui-monospace,Consolas,monospace;font-style:normal;color:var(--cc,var(--ink))}
.choice:disabled{opacity:.38;cursor:not-allowed}
.choice.ask{--cc:var(--muted);flex:0 1 auto}
.vn{position:absolute;inset:0;overflow:hidden}
.vn .layer{position:absolute;inset:0}
.vn .ui{position:absolute;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;gap:10px;justify-items:center}
.vn .ui>*{width:min(860px,100%)}
.skip{position:absolute;right:14px;top:12px;z-index:4;min-height:38px;padding:4px 14px;border-radius:999px;border:1px solid var(--edge);background:rgba(11,17,26,.8);color:var(--muted);font:700 .8rem var(--heading);cursor:pointer}
.skip:hover{color:var(--ink);border-color:var(--ink)}
.car{background:linear-gradient(180deg,#0a0f18 0%,#121b2a 100%);animation:rumble .18s linear infinite}
@keyframes rumble{0%{transform:translateY(0)}50%{transform:translateY(1.2px)}100%{transform:translateY(0)}}
.car .shield{position:absolute;left:8%;right:8%;top:6%;height:52%;clip-path:polygon(6% 0,94% 0,100% 100%,0 100%);background:linear-gradient(180deg,#1b2a48 0%,#3a3f6b 45%,#d98f6a 78%,#f5c27e 100%);overflow:hidden;border-radius:10px}
.car .shield::before{content:"";position:absolute;left:0;right:0;top:0;height:60%;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1px 1px at 45% 50%,#cfe,transparent),radial-gradient(1px 1px at 85% 45%,#fff,transparent);opacity:.7}
.car .tower{position:absolute;left:63%;bottom:22%;width:1.4%;height:30%;background:#0c1220;box-shadow:0 0 0 1px rgba(255,199,121,.2)}
.car .tower::after{content:"";position:absolute;left:180%;bottom:0;width:180%;height:85%;background:#0c1220;border-radius:40% 40% 0 0}
.car .road{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#1a1f2a,#0b0e14)}
.car .road::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:repeating-linear-gradient(180deg,#e8d9a0 0 18px,transparent 18px 44px);animation:road .5s linear infinite;transform:perspective(200px) rotateX(55deg);transform-origin:top}

.car .dash{position:absolute;left:0;right:0;bottom:0;height:44%;background:linear-gradient(180deg,#1a2230,#0b1018);border-top:2px solid #2a3546;border-radius:40% 40% 0 0/22% 22% 0 0}

.hangar{background:linear-gradient(180deg,#0d1420 0%,#172133 60%,#0b1018 100%)}
.hangar .floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(90deg,rgba(142,213,243,.06) 0 2px,transparent 2px 60px),linear-gradient(180deg,#1a2332,#0a0f17);transform-origin:top;}
.hangar .beam{position:absolute;top:0;width:24%;height:80%;background:linear-gradient(180deg,rgba(255,227,168,.16),transparent);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);animation:beam 4s ease-in-out infinite alternate}

.hangar .rocket{position:absolute;left:50%;bottom:30%;width:min(86px,9vw);height:62%;transform:translateX(-50%);background:linear-gradient(90deg,#4a5568,#d8dee8 40%,#8b97aa 70%,#3a4556);border-radius:50% 50% 6px 6px/22% 22% 6px 6px}
.hangar .rocket::after{content:"MAPS";position:absolute;left:50%;top:44%;transform:translateX(-50%) rotate(90deg);font:800 .7rem var(--heading);letter-spacing:.3em;color:#1a2230}
.hangar .gantry{position:absolute;left:calc(50% + min(60px,6vw));bottom:30%;width:min(26px,3vw);height:66%;background:repeating-linear-gradient(45deg,#2a3546 0 3px,transparent 3px 12px),repeating-linear-gradient(-45deg,#2a3546 0 3px,transparent 3px 12px);border-left:3px solid #2a3546;border-right:3px solid #2a3546}
.fig{position:absolute;bottom:30%;display:grid;justify-items:center;transition:opacity .3s,transform .3s;opacity:.55;transform:scale(.96)}
.fig.speaking{opacity:1;transform:none}
.fig .ava{width:clamp(70px,10vw,110px);height:clamp(70px,10vw,110px)}
.fig .torso{width:clamp(80px,12vw,130px);height:clamp(60px,9vw,96px);margin-top:-8px;border-radius:40% 40% 10px 10px;background:linear-gradient(180deg,#e2e8f0,#9aa7b9);box-shadow:inset 0 -8px 0 rgba(0,0,0,.15);position:relative}
.fig .torso::after{content:"";position:absolute;left:44%;top:12%;width:12%;height:70%;border-radius:4px;background:var(--c)}
.fig .tag{margin-top:6px;padding:2px 10px;border-radius:999px;background:rgba(11,17,26,.85);border:1px solid var(--c);font:700 .72rem var(--heading);color:var(--c);white-space:nowrap}
.budget{display:flex;height:22px;border-radius:7px;overflow:hidden;border:1px solid var(--edge)}
.budget i{display:grid;place-items:center;font:700 .66rem var(--heading);font-style:normal;color:#0b111a;white-space:nowrap;overflow:hidden}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:.95rem}
.kv span:nth-child(odd){color:var(--muted)}.kv span:nth-child(even){font-weight:700}
.big{font:800 2.2rem/1 var(--heading)}
.frame{position:absolute;inset:0;border:0;width:100%;height:100%;background:#0b111a}
.next{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:5;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 16px;border-radius:999px;background:rgba(11,17,26,.92);border:1px solid var(--mint);box-shadow:0 0 30px -6px var(--mint),0 14px 30px -12px #000;animation:scrIn .4s both}

.stepchip{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:5;pointer-events:none;padding:4px 14px;border-radius:999px;background:rgba(11,17,26,.9);border:1px solid var(--edge);font:700 .74rem var(--heading);color:var(--muted);white-space:nowrap;animation:chipOut 5s forwards}

.loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(80% 70% at 50% 40%,#132034,#05080d);animation:fadeIn .25s both;cursor:pointer}

@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
.ld{width:min(520px,calc(100% - 40px));display:grid;gap:16px;justify-items:center;text-align:center}
.ld .ring{position:relative;width:86px;height:86px}
.ld .ring .moon{position:absolute;inset:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f2f4f8,#9aa7b9 55%,#3a4556)}

.ld .logo b{font-size:1.6rem}.ld .logo .orb{width:28px;height:28px}

.ld .pbar{width:100%;height:6px;border-radius:3px;background:#1d2736;overflow:hidden}.ld .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:3px}
.ld .fact{display:grid;gap:4px;padding:12px 16px;border-radius:12px;border:1px solid #2a3648;background:rgba(17,24,35,.85);font-size:.95rem;text-wrap:pretty}
.ld .fact b{font:800 .66rem var(--heading);letter-spacing:.16em;color:var(--violet);text-transform:uppercase}
.ld .tap{font-size:.72rem;color:var(--muted)}
canvas.full{position:absolute;inset:0;width:100%;height:100%;display:block}
.toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:4;padding:10px 18px;border-radius:12px;background:rgba(40,12,12,.9);border:1px solid var(--red);color:var(--red);font:800 1rem var(--heading);letter-spacing:.04em;text-align:center;animation:scrIn .3s both}
.tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.chip.ok em{color:var(--mint)}.chip.ko em{color:var(--red)}
.stars{display:flex;flex-wrap:wrap;gap:8px}
