<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<script src="lang-mg-a.js"></script><script src="lang-mg-b.js"></script><script src="lang-mg-c.js"></script><script src="lang-mg-d.js"></script><script src="lab-shell.js"></script><script src="mg-howto.js"></script>
<title>Panel eléctrico · MAPS Lab</title>
<style>
:root{--bg:#101721;--surface:#171f2c;--edge:#344255;--ink:#f0f4fa;--muted:#acbbce;--blue:#8ed5f3;--gold:#ffc779;--mint:#90e1bd;--red:#ff8a7a;--accent:#ffc779;--heading:"Bahnschrift","Segoe UI",system-ui,sans-serif;font:clamp(16px,.55vw + 11.5px,19px)/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
a{color:var(--blue)}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:10px clamp(10px,2vw,20px);gap:8px}
.top{display:flex;align-items:center;gap:10px}
.mark{font-size:.72rem;font-weight:750;padding:3px 7px;border:1px solid var(--edge);white-space:nowrap}
.titles{min-width:0;flex:1}
.mission{display:block;color:var(--accent);font-size:.76rem;font-weight:650}
h1{margin:0;font-family:var(--heading);font-size:clamp(1.1rem,2.6vw,1.5rem);line-height:1.12;letter-spacing:-.02em}
.reset{min-height:44px;padding:0 16px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;font:700 .9rem var(--heading);cursor:pointer}
.reset:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.goal{margin:0;color:var(--muted);font-size:.9rem;text-wrap:pretty}
.goal strong{color:var(--ink)}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,27vw,390px);gap:10px}
.scene{position:relative;min-height:0;background:#0b111a;border:1px solid var(--edge);border-radius:10px;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:calc(100% - 20px);pointer-events:none;font-size:.84rem;padding:5px 12px;border-radius:999px;background:rgba(11,17,26,.82);border:1px solid var(--edge);text-align:center}
.panel{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0;padding-bottom:4px}
.box{background:var(--surface);border:1px solid var(--edge);border-radius:8px;padding:10px;display:grid;gap:8px}
.box h2{margin:0;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;font:700 .76rem var(--heading);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seat{font-size:.68rem;text-transform:none;letter-spacing:0;padding:1px 7px;border-radius:999px;border:1px solid currentColor;color:var(--accent);white-space:nowrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:max-content;min-height:42px;padding:4px 8px;border:1px solid var(--edge);border-radius:5px;background:var(--bg);color:var(--ink);font:inherit;font-size:.84rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.seg button:disabled{opacity:.45;cursor:default}
.btn{min-height:44px;width:100%;padding:6px 10px;border:1px solid var(--edge);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-weight:650;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.note{margin:0;color:var(--muted);font-size:.83rem;text-wrap:pretty}
.feedback{margin:0;min-height:2.9em;font-size:.92rem;text-wrap:pretty}
[data-tone="good"]{color:var(--mint)}
[data-tone="warn"]{color:var(--gold)}
[data-tone="bad"]{color:var(--red)}
.row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--edge);padding:5px 0;font-size:.86rem}
.row:first-child{border-top:0;padding-top:0}
.row span:first-child{color:var(--muted)}
.row span:last-child{text-align:right;font-weight:650}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){
  body{overflow:auto}
  .app{height:auto;min-height:100dvh}
  .main{grid-template-columns:1fr}
  .scene{aspect-ratio:var(--ar,8 / 5);max-height:72vh;width:100%}
  .panel{overflow:visible}
}
@media (max-width:820px) and (orientation:landscape){
  .main{grid-template-columns:minmax(0,1fr) 250px}
  .scene{aspect-ratio:auto;height:calc(100dvh - 96px);max-height:none}
  .goal{display:none}
  .panel{overflow:auto;max-height:calc(100dvh - 96px)}
}

.scene{background:radial-gradient(120% 90% at 50% 0%,#111a28,#070b11);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 22px 44px -26px #000}
.box{background:linear-gradient(180deg,#1b2432,#151c27);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 18px -12px rgba(0,0,0,.8)}
.btn,.seg button,.reset{transition:transform .08s ease,box-shadow .12s ease,background-color .15s,border-color .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 0 rgba(0,0,0,.5)}
.btn:active:not(:disabled),.btn.held,.seg button:active:not(:disabled),.reset:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 1px 0 rgba(0,0,0,.5)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent),#fff 18%),var(--accent))}
.btn.held{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 24%,var(--bg))}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,color-mix(in srgb,var(--accent),#fff 16%),var(--accent));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 12px -3px color-mix(in srgb,var(--accent) 70%,transparent)}
.hint{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 20px -8px #000;animation:hintIn .35s ease both}
@keyframes hintIn{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
.feedback.bump{animation:bump .45s ease}
@keyframes bump{from{transform:translateX(-5px);opacity:.35}to{transform:none;opacity:1}}
.row span:last-child{border-radius:4px;padding:0 4px;margin-right:-4px}
.row span:last-child.chg{animation:chg .9s ease both}
@keyframes chg{from{background:color-mix(in srgb,currentColor 30%,transparent)}to{background:transparent}}
.drive{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.drive .btn{font-size:1rem;min-height:52px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.talk{position:absolute;left:10px;top:10px;z-index:3;width:min(440px,calc(100% - 20px));max-height:calc(100% - 20px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
.talk>*{pointer-events:auto}
.talk[data-tone]{color:var(--ink)}
.talk.in{animation:tkIn .45s cubic-bezier(.2,.9,.25,1.15) both}
.talk[data-tone="good"]{--tc:var(--mint)}.talk[data-tone="warn"]{--tc:var(--gold)}.talk[data-tone="bad"]{--tc:var(--red)}
.thead{display:flex;align-items:center;gap:6px}
.verdict{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 12px;border-radius:999px;background:rgba(11,17,26,.92);border:1px solid var(--tc,var(--edge));color:var(--tc,var(--ink));font:800 .86rem/1.2 var(--heading);letter-spacing:.03em;text-transform:uppercase;box-shadow:0 0 26px -8px var(--tc,transparent)}
.verdict::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;background:var(--tc,var(--muted));box-shadow:0 0 10px var(--tc,transparent);animation:blink 1.2s infinite}
.thead .btn{width:auto;min-height:34px;padding:2px 12px;font-size:.82rem;flex:none}
.talk .x{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);background:rgba(11,17,26,.92);color:var(--muted);font:600 1.1rem/1 system-ui;cursor:pointer}
.talk .x:hover{color:var(--ink);border-color:var(--ink)}
.feed{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.msg{display:flex;align-items:flex-start;gap:8px;cursor:pointer;transition:opacity .35s;animation:msgIn .35s cubic-bezier(.2,.9,.3,1.2) both}
.msg.old{opacity:.6}
.ava{flex:none;position:relative;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--c),#fff 40%),var(--c) 46%,color-mix(in srgb,var(--c),#000 62%));box-shadow:0 0 0 2px rgba(11,17,26,.92),0 0 0 3.5px var(--c),0 8px 18px -6px #000,0 0 24px -6px var(--c)}
.ava .visor{position:absolute;left:8px;right:8px;top:12px;height:17px;border-radius:10px 10px 7px 7px;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:2px;background:linear-gradient(160deg,#2c3d56 0%,#070b11 55%,#131c29 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -2px 4px rgba(0,0,0,.6)}
.ava .visor::after{content:"";position:absolute;left:4px;top:2px;width:10px;height:4px;border-radius:50%;background:rgba(255,255,255,.32);transform:rotate(-14deg)}
.ava .visor i{display:block;width:2px;height:2px;border-radius:1px;background:var(--c);box-shadow:0 0 5px var(--c)}
.ava.talking{animation:bob .6s ease-in-out infinite alternate}
.ava.talking .visor i{animation:wave .4s ease-in-out infinite alternate}
.ava.talking .visor i:nth-child(2){animation-delay:-.12s}.ava.talking .visor i:nth-child(3){animation-delay:-.3s}.ava.talking .visor i:nth-child(4){animation-delay:-.06s}.ava.talking .visor i:nth-child(5){animation-delay:-.22s}
.ava .ini{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font:800 .5rem var(--heading);letter-spacing:.1em;color:rgba(7,11,17,.85)}
.bubble{flex:1;min-width:0;padding:7px 10px 8px;border-radius:4px 12px 12px 12px;background:rgba(17,24,35,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,var(--c) 50%,var(--edge));box-shadow:0 12px 28px -14px #000}
.who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.who b{font:800 .82rem var(--heading);color:var(--c)}.who span{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.say{margin:2px 0 0;min-height:1.4em;font-size:.88rem;line-height:1.4;text-wrap:pretty;color:var(--ink)}
.scene:has(.talk:not([hidden])) .hint{display:none}
@keyframes wave{from{height:2px}to{height:11px}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@keyframes msgIn{from{opacity:0;transform:translateX(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tkIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.35}}
@media (max-width:520px){.say{font-size:.82rem}.ava{width:38px;height:38px}.ava .visor{left:7px;right:7px;top:10px;height:15px}}
.speed{position:absolute;right:10px;top:10px;z-index:2;min-width:52px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--accent);background:rgba(11,17,26,.88);color:var(--accent);font:800 .95rem var(--heading);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.5);transition:transform .08s}
.speed:active{transform:translateY(2px)}
.speed[data-x="2"],.speed[data-x="3"]{background:var(--accent);color:var(--bg)}

.scorecard{display:grid;gap:6px;padding:8px 12px;border-radius:12px;background:rgba(11,17,26,.93);border:1px solid var(--edge);box-shadow:0 12px 28px -14px #000;animation:msgIn .35s .1s both}
.sctop{display:flex;align-items:baseline;gap:8px}
.stars{display:flex;gap:2px;align-self:center;font-size:1.35rem;line-height:1}
.stars i{font-style:normal;color:#2a3546}
.stars i.on{color:var(--gold);text-shadow:0 0 12px rgba(255,199,121,.7);animation:starIn .45s cubic-bezier(.2,.9,.3,1.6) both}
.pts{margin-left:4px;font:800 1.6rem/1 var(--heading);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sctop small{color:var(--muted);font-size:.75rem}
.rec{margin-left:auto;align-self:center;padding:2px 8px;border-radius:999px;border:1px solid var(--edge);color:var(--muted);font-size:.74rem;white-space:nowrap}
.rec.new{color:var(--bg);background:var(--gold);border-color:var(--gold);font-weight:800;animation:blink 1s infinite}
.areas{display:flex;flex-wrap:wrap;gap:4px}
.areas span{display:flex;align-items:baseline;gap:6px;padding:2px 8px;border-radius:6px;background:rgba(52,66,85,.45);font-size:.74rem}
.areas em{font-style:normal;color:var(--muted)}.areas b{font-variant-numeric:tabular-nums}
@keyframes starIn{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}

.top .speed{position:static;min-height:44px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 0 rgba(0,0,0,.5)}
.reset[data-pen]::after{content:attr(data-pen);margin-left:6px;font-size:.72rem;color:var(--red)}
.areas .mod.up{background:color-mix(in srgb,var(--mint) 20%,transparent)}.areas .mod.up b{color:var(--mint)}
.areas .mod.down{background:color-mix(in srgb,var(--red) 18%,transparent)}.areas .mod.down b{color:var(--red)}

.app{max-width:1680px;margin:0 auto;width:100%}
.rotate{display:none}
@media (orientation:portrait) and (max-width:600px){.rotate:not([hidden]){display:flex;position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:9;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(17,24,35,.97);border:1px solid var(--accent);box-shadow:0 14px 30px -10px #000;font-size:.86rem}
  .rotate i{flex:none;width:22px;height:34px;border:2px solid var(--accent);border-radius:5px;animation:rot 2.4s ease-in-out infinite}
  .rotate div{flex:1;display:grid;gap:2px}.rotate b{font-family:var(--heading)}.rotate span{color:var(--muted);font-size:.78rem}
  .rotate button{flex:none;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--edge);background:var(--bg);color:var(--ink);font:600 .8rem var(--heading);cursor:pointer}}
@keyframes rot{0%,30%{transform:none}55%,85%{transform:rotate(-90deg)}100%{transform:none}}
@media (orientation:landscape) and (max-height:540px) and (pointer:coarse){
  body{overflow:hidden}
  .app{height:100vh;height:100dvh;min-height:0;padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));gap:6px}
  .top{gap:8px}.mark,.mission,.goal{display:none}h1{font-size:1rem}
  .reset,.top .speed{min-height:38px;padding:0 12px;font-size:.82rem}
  .main{grid-template-columns:minmax(0,1fr) clamp(210px,30vw,280px);gap:6px}
  .scene{aspect-ratio:auto;height:auto;max-height:none;min-height:0}
  .panel{display:flex;overflow:auto;max-height:none;gap:6px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .panel .box.pri{order:-1}
  .box{padding:8px;gap:6px}.box h2{font-size:.66rem}
  .note{font-size:.74rem}.feedback{font-size:.8rem;min-height:2.4em}.row{font-size:.76rem;padding:3px 0}
  .seg button{min-height:40px;font-size:.76rem;padding:2px 6px}
  .btn{min-height:42px;font-size:.82rem}.drive .btn{min-height:48px}
  .hint{font-size:.72rem;padding:3px 10px;top:6px}
  .talk{width:min(360px,64%);left:6px;top:6px;max-height:calc(100% - 12px);gap:4px}
  .verdict{font-size:.72rem;padding:4px 10px}
  .thead .btn{min-height:30px;font-size:.74rem;padding:0 10px}.talk .x{width:30px;height:30px}
  .scorecard{padding:5px 9px;gap:4px}.pts{font-size:1.2rem}.stars{font-size:1.05rem}.areas span{font-size:.66rem;padding:1px 6px}
  .ava{width:32px;height:32px}.ava .visor{left:6px;right:6px;top:9px;height:12px}.ava .ini{display:none}
  .bubble{padding:5px 8px}.say{font-size:.76rem;line-height:1.35}.who b{font-size:.72rem}.who span{font-size:.58rem}
  .stage{overflow-y:auto;gap:6px}
  .stage .scene{flex:none;width:100%;height:auto;aspect-ratio:800 / 420;max-height:calc(100dvh - 64px)}
  .console{padding:8px;gap:6px}.c-head{flex-wrap:nowrap}.resw span{display:none}
  .slots{grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}.slot{min-height:44px;padding:12px 2px 3px}.slot small{display:none}.slot b{font-size:.6rem}.slot.full::after{display:none}
  .palette{gap:6px}.card{min-height:40px;font-size:.72rem;padding:3px 8px 3px 4px}.card i{width:22px;height:22px;font-size:.68rem}
  .c-run .btn{min-height:42px}.c-tools .btn{min-height:34px}
}
@media (orientation:landscape) and (max-height:380px){.main{grid-template-columns:minmax(0,1fr) clamp(200px,28vw,250px)}.feedback{min-height:0}}

body.campaign #reset,body.campaign:not(.spdok) .top .speed,body.campaign .rec,body.campaign .thead .btn,body.campaign .box.cfg,body.campaign .rotate{display:none!important}
@media (orientation:landscape) and (max-height:540px) and (pointer:coarse){:root{font-size:15px}}
.note{font-size:.92rem}.box h2{font-size:.84rem}.seat{font-size:.74rem}.feedback{font-size:1rem}.state{font-size:.95rem}.btn{font-size:1rem}.seg button{font-size:.92rem}.goal{font-size:.98rem}.hint{font-size:.95rem}
body.campaign.spdok #panel>.speed{position:sticky!important;top:0;z-index:5;display:block!important;width:100%;min-height:40px;margin:0;flex:none;order:-1}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="mark">MAPS · LAB</span>
    <div class="titles"><span class="mission">Pulso en la totalidad · La cuna de cuarzo · energía</span><h1>Panel eléctrico</h1></div>
    <button id="reset" class="reset" type="button">Reiniciar</button>
  </header>
  <p class="goal"><strong>Objetivo.</strong> Conecta las cargas sin pasar el margen del bus y decide qué función queda operativa y cuál cede energía. Si algo se rompe, repáralo a mano.</p>
  <div class="main">
    <div class="scene"><canvas id="cv" aria-label="Escena del minijuego"></canvas><div class="hint" id="hint" hidden></div></div>
    <aside class="panel" id="panel" aria-label="Controles y estado"></aside>
  </div>
</div>
<script>
const C={bg:'#0b111a',bg2:'#101721',surface:'#171f2c',edge:'#344255',ink:'#f0f4fa',muted:'#acbbce',blue:'#8ed5f3',gold:'#ffc779',mint:'#90e1bd',red:'#ff8a7a',violet:'#d5afff'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,hyp=Math.hypot;
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')'}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rgbOf=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
const blend=(a,b,t)=>{const A=rgbOf(a),B=rgbOf(b);return '#'+A.map((v,i)=>Math.round(clamp(v+(B[i]-v)*t,0,255)).toString(16).padStart(2,'0')).join('')};
const tint=(h,k)=>blend(h,k>0?'#ffffff':'#000000',Math.abs(k));
function Lab(o){
  o=o||{};const W=o.W||800,H=o.H||500;
  document.querySelector('.scene').style.setProperty('--ar',W+' / '+H);
  const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
  let s=1,ox=0,oy=0,dpr=1;
  const lab={W,H,ctx,cv,t:0,pressed:false,pointer:null,held:{},fx:[],sh:0,spd:o.speed||1};lab.minSpd=lab.spd;
  function fit(){const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);s=Math.min(r.width/W,r.height/H);ox=(r.width-W*s)/2;oy=(r.height-H*s)/2}

  lab.hint(rep?'Arrastra cada cable hasta el borne de su color':demand()===0&&!drag&&dmg==='none'?'Arrastra un cable desde el bus hasta una carga':dmg==='hit'&&!rep?(carry==='pdu'?'Avería: aísla y cambia el panel':'Avería sin repuesto: «apaga el sensor, todavía podemos mandar el cráter B»'):'');};
let diverted=false;const fixed0=fixed;fixed=function(){fixed0();lab.pop(improvised?'PUENTE IMPROVISADO':'PANEL CAMBIADO',400,150,C.mint,16);if(improvised)lab.say('Puente improvisado con '+IMPN[improvised].toLowerCase()+': el bus vuelve a '+cap+' u. Esa pieza ya no servirá para lo que la trajimos.','good')};
function reset(){lab.debrief(null);segM.set(mission);segK.set(carry);diverted=false;kNote.textContent=carry==='ninguno'?'No llevaste módulo: si falla la distribución, solo queda apagar el sensor y desviar energía a la radio.':carry==='pdu'?'Llevaste el panel de repuesto y dejaste el compresor: si falla la distribución, se puede reparar.':'Llevaste el compresor y dejaste el repuesto: si falla la distribución, no hay arreglo, pero puedes enviar datos comprimidos.';conn={sensor:null,heater:null,radio:null};drag=null;overT=0;tripped=false;confirmed=null;cap=CAP0;dmg='none';stableT=0;cut=null;rep=null;meteor=null;refreshNote();lab.say('Dos cargas pesadas a la vez superan el margen. Decide cuál cede. Atento a los imprevistos.','')}
lab.reset=reset;reset();
